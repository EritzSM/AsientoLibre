<!-- ===== Header Component ===== -->
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="/index.html" aria-label="Asiento Libre — inicio">
      <!-- Logo Asiento Libre -->
      <img 
        src="/images/logo.png" 
        alt="Logo Asiento Libre" 
        class="logo-img" 
        id="site-logo"
        onload="const fb = this.parentElement.querySelector('.logo-fallback'); if(fb) fb.style.display='none';"
        onerror="this.style.display='none';" 
      />
      <!-- Icono provisional (se oculta automáticamente) -->
      <svg class="logo-mark logo-fallback" width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M17 2C10.4 2 5 7.2 5 13.6 5 22 17 32 17 32s12-10 12-18.4C29 7.2 23.6 2 17 2Z" fill="#0B1E3B" />
        <path d="M9 15c3 6 8 9 8 9s8.5-4.5 8.5-11" stroke="#17BFAC" stroke-width="2.4" stroke-linecap="round" fill="none" />
      </svg>
      <span>Asiento Libre</span>
    </a>
    
    <nav class="main-nav" aria-label="Navegación principal">
      <a href="/index.html#publicar" data-scroll>Publicar ruta</a>
      <a href="/index.html#buscar" data-scroll>Buscar asiento</a>
      
      <!-- Botón Iniciar sesión (para usuarios no autenticados) -->
      <a href="/login.html" class="btn btn-primary btn-login" id="btn-login">Iniciar sesión</a>

      <!-- Apartado de Perfil de Usuario (para usuarios autenticados) -->
      <div class="user-profile-menu" id="user-profile-menu" style="display: none;">
        <button class="user-profile-btn" id="user-profile-btn" type="button" aria-expanded="false" aria-haspopup="true">
          <span class="user-avatar" id="header-user-avatar">US</span>
          <span class="user-name" id="header-user-name">Usuario</span>
          <svg class="chevron-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <!-- Menú desplegable del Perfil -->
        <div class="profile-dropdown" id="profile-dropdown" hidden>
          <div class="dropdown-header">
            <p class="dropdown-user-fullname" id="dropdown-user-name">Usuario Nombre</p>
            <span class="dropdown-user-role" id="dropdown-user-role">Pasajero</span>
          </div>
          <div class="dropdown-divider"></div>
          <a href="/profile.html" class="dropdown-item" id="btn-view-profile">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Mi Perfil
          </a>
          <a href="/index.html#buscar" class="dropdown-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            Mis Viajes
          </a>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item dropdown-item-danger" id="btn-logout" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Cerrar sesión
          </button>
        </div>
      </div>

    </nav>
  </div>
</header>
